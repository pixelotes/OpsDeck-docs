name: Export PDF

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies (WeasyPrint + Chromium)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev libcairo2 chromium-browser

      - run: |
          pip install -r requirements.txt
          python -c "import weasyprint; print(weasyprint.__version__)"
          python -c "import weasyprint.layout.grid" 2>&1 || echo "NO grid module - good"

      - name: Build with PDF export
        env:
          ENABLE_PDF_EXPORT: "1"
        run: mkdocs build

      - name: Upload PDF to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: site/export/opsdeck-docs.pdf

      - name: Upload PDF as artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: opsdeck-docs-pdf
          path: site/export/opsdeck-docs.pdf
